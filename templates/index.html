<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emotion Detection Application</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">

            <h1 class="text-center mb-4">
                NLP - Emotion Detection
            </h1>

            <label for="textToAnalyze">
                Please enter the text to be analyzed
            </label>

            <textarea
                class="form-control"
                id="textToAnalyze"
                rows="4"
                placeholder="Enter customer feedback here..."
            ></textarea>

            <div class="text-center mt-4">
                <button
                    onclick="RunSentimentAnalysis()"
                    class="btn btn-primary">
                    Detect Emotions
                </button>
            </div>

            <h4 class="mt-4">Result of Emotion Detection</h4>

            <div
                id="system_response"
                class="alert alert-info mt-3"
                role="status">
                Your results will appear here.
            </div>

        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='mywebscript.js') }}"></script>

</body>
</html>
